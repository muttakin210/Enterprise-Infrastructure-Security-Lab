! FW01 - Cisco ISR 2911: Packet Tracer stand-in for the pfSense firewall.
! Same role as pfSense in the VirtualBox lab: inter-zone routing (router-on-a-stick), zone policy
! (default deny between zones, least privilege), DHCP for Users, and outbound NAT/PAT to the internet.
! Secrets are placeholders: <ENABLE_SECRET> <ADMIN_SECRET> <SNMP_AUTH> <SNMP_PRIV>
enable
configure terminal
hostname FW01
no ip domain-lookup
ip domain-name corp.lab
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
service password-encryption
login block-for 120 attempts 3 within 60
banner motd ^Authorised access only. Activity is logged.^
!
ip dhcp excluded-address 192.168.30.1 192.168.30.99
ip dhcp excluded-address 192.168.30.200 192.168.30.254
ip dhcp pool USERS
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.20.20
 domain-name corp.lab
!
interface GigabitEthernet0/0
 description TRUNK-TO-CORE-SW1
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 description MANAGEMENT
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip access-group MGMT-IN in
 ip nat inside
interface GigabitEthernet0/0.20
 description SERVERS
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip access-group SERVERS-IN in
 ip nat inside
interface GigabitEthernet0/0.30
 description USERS
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip access-group USERS-IN in
 ip nat inside
interface GigabitEthernet0/0.40
 description SECURITY
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip access-group SECURITY-IN in
 ip nat inside
interface GigabitEthernet0/0.50
 description DMZ
 encapsulation dot1Q 50
 ip address 192.168.50.1 255.255.255.0
 ip access-group DMZ-IN in
 ip nat inside
interface GigabitEthernet0/0.999
 description NATIVE-PARKING
 encapsulation dot1Q 999 native
interface GigabitEthernet0/1
 description WAN-TO-ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! ---- zone policy: each ACL filters traffic entering the firewall FROM that zone ----
ip access-list extended MGMT-IN
 remark Management may manage everything
 permit ip 192.168.10.0 0.0.0.255 any
ip access-list extended SERVERS-IN
 remark replies to sessions opened by other zones
 permit tcp 192.168.20.0 0.0.0.255 any established
 permit udp host 192.168.20.20 eq domain any
 permit icmp 192.168.20.0 0.0.0.255 any echo-reply
 remark monitor01 polls devices and DMZ over SNMPv3
 permit udp host 192.168.20.10 192.168.10.0 0.0.0.255 eq snmp
 permit udp host 192.168.20.10 host 192.168.50.10 eq snmp
 permit icmp host 192.168.20.10 any echo
 permit icmp 192.168.20.0 0.0.0.255 host 192.168.20.1
 deny ip 192.168.20.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 remark updates to the internet
 permit ip 192.168.20.0 0.0.0.255 any
ip access-list extended USERS-IN
 permit udp any any eq bootps
 permit icmp 192.168.30.0 0.0.0.255 host 192.168.30.1
 permit icmp 192.168.30.0 0.0.0.255 any echo-reply
 remark only the services users need
 permit udp 192.168.30.0 0.0.0.255 host 192.168.20.20 eq domain
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.20.20 eq 22
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.20.20 eq www
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.20.20 eq 443
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.10 eq www
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.10 eq 443
 deny ip 192.168.30.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 192.168.30.0 0.0.0.255 any
ip access-list extended SECURITY-IN
 remark authorised test targets only
 permit ip 192.168.40.0 0.0.0.255 host 192.168.20.20
 permit ip 192.168.40.0 0.0.0.255 host 192.168.50.10
 permit tcp 192.168.40.0 0.0.0.255 any established
 permit icmp 192.168.40.0 0.0.0.255 any echo-reply
 permit icmp 192.168.40.0 0.0.0.255 host 192.168.40.1
 deny ip 192.168.40.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 192.168.40.0 0.0.0.255 any
ip access-list extended DMZ-IN
 permit tcp 192.168.50.0 0.0.0.255 any established
 permit icmp 192.168.50.0 0.0.0.255 any echo-reply
 permit udp host 192.168.50.10 eq snmp host 192.168.20.10
 permit tcp host 192.168.50.10 host 192.168.20.10 eq 1514
 permit tcp host 192.168.50.10 host 192.168.20.10 eq 1515
 remark DMZ must never reach Management
 deny ip 192.168.50.0 0.0.0.255 192.168.10.0 0.0.0.255 log
 deny ip 192.168.50.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 192.168.50.0 0.0.0.255 any
!
ip access-list standard NAT-INSIDE
 permit 192.168.0.0 0.0.255.255
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/1 overload
!
ip access-list standard VTY-ADMIN
 permit 192.168.10.0 0.0.0.255
 permit host 192.168.20.10
 deny any log
ip access-list standard SNMP-MANAGER
 permit host 192.168.20.10
 deny any
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 login local
 exec-timeout 10 0
line vty 0 4
 login local
 transport input ssh
 access-class VTY-ADMIN in
 exec-timeout 10 0
!
snmp-server group NMS-GROUP v3 priv access SNMP-MANAGER
snmp-server user nmsuser NMS-GROUP v3 auth sha <SNMP_AUTH> priv aes 128 <SNMP_PRIV>
snmp-server host 192.168.20.10 version 3 priv nmsuser
logging host 192.168.20.10
logging trap informational
service timestamps log datetime msec
end
write memory
