! CORE-SW1 - Cisco 2960 access/distribution switch for the five zones
! Secrets are placeholders: <ENABLE_SECRET> <ADMIN_SECRET> <SNMP_AUTH> <SNMP_PRIV>
enable
configure terminal
hostname CORE-SW1
no ip domain-lookup
ip domain-name corp.lab
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
service password-encryption
banner motd ^Authorised access only. Activity is logged.^
!
vlan 10
 name MANAGEMENT
vlan 20
 name SERVERS
vlan 30
 name USERS
vlan 40
 name SECURITY
vlan 50
 name DMZ
vlan 999
 name PARKING
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
ip dhcp snooping
ip dhcp snooping vlan 30
no ip dhcp snooping information option
!
interface GigabitEthernet0/1
 description UPLINK-TO-FIREWALL
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50
 switchport nonegotiate
 ip dhcp snooping trust
 no shutdown
!
interface FastEthernet0/1
 description ADMIN-PC
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
!
interface FastEthernet0/2
 description MONITOR01-UBUNTU-SERVER
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/3
 description KALI-LAB
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
!
interface FastEthernet0/4
 description SRV01-TARGET-SERVER
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/5
 description CLIENT01-USER
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 ip dhcp snooping limit rate 10
!
interface FastEthernet0/6
 description DMZ-WEB01
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
!
interface range FastEthernet0/7 - 24
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet0/2
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan1
 no ip address
 shutdown
interface Vlan10
 description MANAGEMENT-SVI
 ip address 192.168.10.2 255.255.255.0
 no shutdown
ip default-gateway 192.168.10.1
!
ip access-list standard VTY-ADMIN
 permit 192.168.10.0 0.0.0.255
 permit host 192.168.20.10
 deny any log
ip access-list standard SNMP-MANAGER
 permit host 192.168.20.10
 deny any
!
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line con 0
 login local
 exec-timeout 10 0
line vty 0 15
 login local
 transport input ssh
 access-class VTY-ADMIN in
 exec-timeout 10 0
!
snmp-server group NMS-GROUP v3 priv access SNMP-MANAGER
snmp-server user nmsuser NMS-GROUP v3 auth sha <SNMP_AUTH> priv aes 128 <SNMP_PRIV>
snmp-server host 192.168.20.10 version 3 priv nmsuser
logging host 192.168.20.10
logging trap informational
service timestamps log datetime msec
end
write memory
